<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mobile Preview</title>
    <style>
      html,
      body {
        margin: 0;
        background: #05050c;
        height: 100%;
        overflow: hidden;
      }

      body {
        display: flex;
        justify-content: center;
      }

      iframe {
        display: block;
        width: min(390px, 100%);
        height: 100vh;
        height: 100dvh;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="preview" src="./index.html?v=20260930-mobile-matrix-3" title="Vander mobile preview"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const target = params.get("target");
      const frame = document.getElementById("preview");

      frame.addEventListener("load", () => {
        const view = frame.contentWindow;
        const doc = frame.contentDocument;
        const element = target ? doc.querySelector(target) : null;

        if (element) {
          const rect = element.getBoundingClientRect();
          view.scrollTo({ top: rect.top + view.scrollY - 92, behavior: "instant" });
        }
      });
    </script>
  </body>
</html>
